{{- if .Values.httpRoute.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "neodash.fullname" . }}
  labels:
    {{- include "neodash.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    {{- if .Values.httpRoute.hostnames }}
    {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}
    {{- else }}
    - {{ (urlParse .Values.publicUrl).hostname | quote }}
    {{- end }}
  rules:
    # UI, API and sign-in share one host and one Service (see ingress.yaml).
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "neodash.fullname" . }}
          port: {{ .Values.service.port }}
      {{- with .Values.httpRoute.timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
