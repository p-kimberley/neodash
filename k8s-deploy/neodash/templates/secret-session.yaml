{{- if not .Values.session.existingSecret }}
{{- $name := include "neodash.sessionSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "neodash.labels" . | nindent 4 }}
  annotations:
    # Keep the key if the release is uninstalled and reinstalled, so sessions survive.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing (index $existing.data .Values.session.secretKey) }}
  {{ .Values.session.secretKey }}: {{ index $existing.data .Values.session.secretKey }}
  {{- else }}
  {{ .Values.session.secretKey }}: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
{{- end }}
