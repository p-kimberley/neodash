{{- include "neodash.validate" . -}}
{{- $caBundle := or .Values.oidc.caBundle.existingSecret .Values.oidc.caBundle.existingConfigMap -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "neodash.fullname" . }}
  labels:
    {{- include "neodash.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "neodash.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      {{- $annotations := deepCopy .Values.podAnnotations }}
      {{- if include "neodash.branding.enabled" . }}
      {{- /* subPath mounts don't update in place, so restart the pods when branding changes. */}}
      {{- $_ := set $annotations "checksum/branding" (include (print $.Template.BasePath "/configmap-branding.yaml") . | sha256sum) }}
      {{- end }}
      {{- with $annotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "neodash.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "neodash.serviceAccountName" . }}
      # NeoDash never talks to the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: neodash
          image: {{ include "neodash.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PUBLIC_URL
              value: {{ .Values.publicUrl | quote }}
            - name: TRUST_PROXY
              value: {{ or .Values.ingress.enabled .Values.httpRoute.enabled | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: NEO4J_URI
              value: {{ .Values.neo4j.uri | quote }}
            - name: NEO4J_DATABASES
              value: {{ join "," .Values.neo4j.databases | quote }}
            {{- with .Values.neo4j.dashboardDatabase }}
            - name: DASHBOARD_DATABASE
              value: {{ . | quote }}
            {{- end }}
            - name: NEO4J_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.neo4j.auth.existingSecret }}
                  key: {{ .Values.neo4j.auth.usernameKey }}
            - name: NEO4J_PASSWORD_FILE
              value: /var/run/secrets/neodash/neo4j-password
            - name: OIDC_ISSUER_URL
              value: {{ .Values.oidc.issuerUrl | quote }}
            {{- with .Values.oidc.discoveryUrl }}
            - name: OIDC_DISCOVERY_URL
              value: {{ . | quote }}
            {{- end }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
            - name: OIDC_CLIENT_SECRET_FILE
              value: /var/run/secrets/neodash/oidc-client-secret
            - name: OIDC_SCOPES
              value: {{ .Values.oidc.scopes | quote }}
            - name: OIDC_ROLES_CLAIM
              value: {{ .Values.oidc.rolesClaim | quote }}
            - name: OIDC_USERNAME_CLAIM
              value: {{ .Values.oidc.usernameClaim | quote }}
            - name: OIDC_ALLOW_INSECURE_HTTP
              value: {{ .Values.oidc.allowInsecureHttp | quote }}
            - name: ROLE_VIEWER
              value: {{ .Values.oidc.roles.viewer | quote }}
            - name: ROLE_EDITOR
              value: {{ .Values.oidc.roles.editor | quote }}
            - name: SESSION_SECRET_FILE
              value: /var/run/secrets/neodash/session-secret
            - name: SESSION_MAX_AGE_SECONDS
              value: {{ .Values.session.maxAgeSeconds | quote }}
            - name: QUERY_TIMEOUT_SECONDS_DEFAULT
              value: {{ .Values.query.timeoutSecondsDefault | quote }}
            - name: QUERY_TIMEOUT_SECONDS_MAX
              value: {{ .Values.query.timeoutSecondsMax | quote }}
            - name: QUERY_ROW_LIMIT_MAX
              value: {{ .Values.query.rowLimitMax | quote }}
            - name: AUDIT_LOG_PARAMETERS
              value: {{ .Values.audit.logParameters | quote }}
            - name: MAP_TILE_URL
              value: {{ .Values.maps.tileUrl | quote }}
            - name: MAP_TILE_ATTRIBUTION
              value: {{ .Values.maps.tileAttribution | quote }}
            - name: MAP_DATA_URL
              value: {{ .Values.maps.dataUrl | quote }}
            {{- with .Values.text2cypher }}
            {{- if .baseUrl }}
            - name: TEXT2CYPHER_BASE_URL
              value: {{ .baseUrl | quote }}
            - name: TEXT2CYPHER_MODEL
              value: {{ .model | quote }}
            - name: TEXT2CYPHER_TIMEOUT_SECONDS
              value: {{ .timeoutSeconds | quote }}
            - name: TEXT2CYPHER_MAX_ATTEMPTS
              value: {{ .maxAttempts | quote }}
            - name: TEXT2CYPHER_TEMPERATURE
              value: {{ .temperature | quote }}
            {{- if .apiKey.existingSecret }}
            - name: TEXT2CYPHER_API_KEY_FILE
              value: /var/run/secrets/neodash/text2cypher-api-key
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if $caBundle }}
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/neodash/ca/{{ .Values.oidc.caBundle.key }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: secrets
              mountPath: /var/run/secrets/neodash
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if $caBundle }}
            - name: ca-bundle
              mountPath: /etc/neodash/ca
              readOnly: true
            {{- end }}
            {{- if include "neodash.branding.enabled" . }}
            - name: branding
              mountPath: /app/public/style.config.json
              subPath: style.config.json
              readOnly: true
            {{- if .Values.branding.logo.base64 }}
            - name: branding
              mountPath: /app/public/brand/{{ .Values.branding.logo.fileName }}
              subPath: {{ .Values.branding.logo.fileName }}
              readOnly: true
            {{- end }}
            {{- end }}
      volumes:
        # Secrets are mounted as files rather than environment variables.
        - name: secrets
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: {{ .Values.neo4j.auth.existingSecret }}
                  items:
                    - key: {{ .Values.neo4j.auth.passwordKey }}
                      path: neo4j-password
              - secret:
                  name: {{ .Values.oidc.existingSecret }}
                  items:
                    - key: {{ .Values.oidc.clientSecretKey }}
                      path: oidc-client-secret
              - secret:
                  name: {{ include "neodash.sessionSecretName" . }}
                  items:
                    - key: {{ .Values.session.secretKey }}
                      path: session-secret
              {{- if and .Values.text2cypher.baseUrl .Values.text2cypher.apiKey.existingSecret }}
              - secret:
                  name: {{ .Values.text2cypher.apiKey.existingSecret }}
                  items:
                    - key: {{ .Values.text2cypher.apiKey.key }}
                      path: text2cypher-api-key
              {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- if include "neodash.branding.enabled" . }}
        - name: branding
          configMap:
            name: {{ include "neodash.fullname" . }}-branding
        {{- end }}
        {{- if .Values.oidc.caBundle.existingSecret }}
        - name: ca-bundle
          secret:
            secretName: {{ .Values.oidc.caBundle.existingSecret }}
        {{- else if .Values.oidc.caBundle.existingConfigMap }}
        - name: ca-bundle
          configMap:
            name: {{ .Values.oidc.caBundle.existingConfigMap }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
