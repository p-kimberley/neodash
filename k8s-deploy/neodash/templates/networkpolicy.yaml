{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "neodash.fullname" . }}
  labels:
    {{- include "neodash.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "neodash.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: http
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    # The `helm test` pod.
    - ports:
        - port: http
      from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "neodash.name" . }}-test
              app.kubernetes.io/instance: {{ .Release.Name }}
  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- with .Values.networkPolicy.egressTo }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
