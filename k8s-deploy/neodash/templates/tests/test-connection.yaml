apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "neodash.fullname" . }}-test"
  labels:
    {{- include "neodash.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    # Reuses the NeoDash image (no extra image to mirror for offline installs). Checks that the
    # service answers and that NeoDash can reach Neo4j.
    - name: check
      image: {{ include "neodash.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      args:
        - -e
        - >-
          const base = 'http://{{ include "neodash.fullname" . }}:{{ .Values.service.port }}';
          Promise.all(['/healthz', '/readyz', '/api/config'].map((p) =>
            fetch(base + p).then((r) => { console.log(p, r.status); if (!r.ok) throw new Error(p + ' ' + r.status); })))
          .then(() => process.exit(0), (e) => { console.error(e.message); process.exit(1); });
