# NeoDash Helm values. Required settings are marked REQUIRED; everything else has a working default.
# See README.md for a walkthrough, including Keycloak setup and offline (air-gapped) installs.

global:
  # Registry to pull all images from, e.g. registry.internal:5000 for an air-gapped cluster.
  # Replaces the registry part of image.repository.
  imageRegistry: ''

nameOverride: ''
fullnameOverride: ''

image:
  registry: ghcr.io
  repository: example/neodash # REQUIRED: where you push the NeoDash image
  tag: '' # defaults to the chart appVersion
  digest: '' # pin by digest (sha256:...); takes precedence over tag
  pullPolicy: IfNotPresent
imagePullSecrets: []

replicaCount: 2

# REQUIRED: the URL users open, e.g. https://neodash.example.com. Used for sign-in redirects and
# secure cookies. With ingress enabled this should be https://<ingress.host>.
publicUrl: ''

neo4j:
  # Bolt URI of the Neo4j server, usually an in-cluster service.
  uri: neo4j://neo4j.neo4j.svc.cluster.local:7687
  # Databases reports may query; the first is the default. Community edition has only "neo4j".
  databases:
    - neo4j
  # Database holding the dashboards (_Neodash_Dashboard nodes); defaults to the first database.
  dashboardDatabase: ''
  # REQUIRED: an existing Secret with the Neo4j credentials (the chart never takes them as values).
  auth:
    existingSecret: ''
    usernameKey: username
    passwordKey: password

oidc:
  # REQUIRED: issuer as browsers see it, e.g. https://keycloak.example.com/realms/acme
  issuerUrl: ''
  # Optional: where the pods fetch the issuer's metadata if not the public URL, e.g. an in-cluster
  # Keycloak service (http://keycloak.keycloak.svc:8080/realms/acme). Its metadata must still name
  # issuerUrl as the issuer.
  discoveryUrl: ''
  clientId: neodash
  # REQUIRED: an existing Secret holding the client secret.
  existingSecret: ''
  clientSecretKey: client-secret
  scopes: openid profile email
  # Token claim holding the user's roles (dot path). For Keycloak client roles use
  # resource_access.<clientId>.roles.
  rolesClaim: realm_access.roles
  usernameClaim: preferred_username
  roles:
    viewer: neodash-viewer
    editor: neodash-editor
  # Only for an http:// identity provider in development.
  allowInsecureHttp: false
  # PEM CA bundle to trust (e.g. an internal CA that signed Keycloak's certificate), from a Secret
  # or ConfigMap key. Leave existingSecret and existingConfigMap empty to use the system CAs.
  caBundle:
    existingSecret: ''
    existingConfigMap: ''
    key: ca.crt

session:
  # Secret holding the cookie-encryption key (>= 32 characters). If empty, the chart generates
  # one on install and keeps it across upgrades. All replicas share it.
  existingSecret: ''
  secretKey: session-secret
  maxAgeSeconds: 28800

query:
  timeoutSecondsDefault: 20
  timeoutSecondsMax: 120
  rowLimitMax: 10000

audit:
  # Include query parameter values in audit log lines.
  logParameters: true

maps:
  # Map background tiles, e.g. an internal tile server https://tiles.internal/{z}/{x}/{y}.png.
  # Empty: no tiles, so nothing is fetched from the internet.
  tileUrl: ''
  tileAttribution: ''
  # Where choropleth / area map charts load country and region shapes. They are bundled in the
  # image and served at /maps; change this only to serve them from elsewhere.
  dataUrl: /maps

ai:
  # Build with AI (reports built from descriptions) through a language model on an OpenAI-compatible
  # API, e.g. vLLM: http://vllm.ai.svc:8000/v1. The backend calls it; browsers never do. It is on when
  # baseUrl and model are set and `enabled` is true; empty baseUrl: off.
  # With networkPolicy.enabled, add the model's address to networkPolicy.egressTo.
  enabled: true
  baseUrl: ''
  # REQUIRED with baseUrl: the model name the API serves, e.g. Qwen/Qwen2.5-Coder-32B-Instruct.
  model: ''
  # Optional API key (sent as a bearer token), from an existing Secret.
  apiKey:
    existingSecret: ''
    key: api-key
  timeoutSeconds: 60
  # Answers the model may give per request: the first, and retries with the error when it fails.
  maxAttempts: 2
  temperature: 0

branding:
  # Product name in the header and browser tab.
  appName: ''
  # Logo shown in the header instead of the NeoDash mark: a base64-encoded PNG or SVG file
  # (e.g. --set-file branding.logo.base64=logo.b64), served from the pod, so it works offline.
  logo:
    base64: ''
    fileName: logo.png
  # Any other style.config.json "style" entries, e.g. design-system colour overrides for the
  # primary colour in both appearances:
  #   --theme-light-color-primary-bg-strong: '#005eb8'
  #   --theme-dark-color-primary-bg-strong: '#78b4ff'
  # (The earlier --palette-light-… / --palette-dark-… names with "R, G, B" values still work.)
  style: {}

logLevel: info

# Extra environment variables for the container (see server/README.md for all settings).
extraEnv: []

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  enabled: true
  className: nginx
  host: '' # REQUIRED when enabled, e.g. neodash.example.com
  path: /
  pathType: Prefix
  annotations:
    # Dashboards are saved as one JSON document; allow large ones.
    nginx.ingress.kubernetes.io/proxy-body-size: 20m
    # Allow queries up to query.timeoutSecondsMax (plus headroom).
    nginx.ingress.kubernetes.io/proxy-read-timeout: '150'
    # The sign-in response sets a session cookie of up to ~4 KB, more than nginx's default 4 KB
    # header buffer ("upstream sent too big header", 502 after sign-in).
    nginx.ingress.kubernetes.io/proxy-buffer-size: 16k
  tls:
    enabled: true
    # Secret with the certificate (e.g. created by cert-manager or imported by hand).
    secretName: ''

# Gateway API alternative to the Ingress (e.g. Envoy Gateway, Istio, Cilium, NGINX Gateway Fabric).
# Attaches an HTTPRoute to an existing Gateway, which terminates TLS. Disable ingress when using it.
httpRoute:
  enabled: false
  # REQUIRED when enabled: the Gateway listener(s) to attach to, e.g.
  #   - name: shared-gateway
  #     namespace: gateway-system
  #     sectionName: https
  parentRefs: []
  # Defaults to the host of publicUrl.
  hostnames: []
  annotations: {}
  # Route timeouts, if your Gateway implementation supports them; allow for query.timeoutSecondsMax.
  #   request: 150s
  timeouts: {}

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    memory: 512Mi

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 10
  timeoutSeconds: 3
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 2
  failureThreshold: 30

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 75

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Restrict traffic to and from the pods. Egress is limited to DNS, Neo4j and the identity provider
# when their addresses are given below. The chart's own `helm test` pod is always allowed in.
networkPolicy:
  enabled: false
  # Pods allowed to reach NeoDash (default: the ingress controller namespace). For a Gateway, use
  # the namespace its data-plane pods run in.
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
  # Destinations NeoDash may reach besides DNS, e.g. Neo4j and Keycloak.
  egressTo: []
    # - to:
    #     - namespaceSelector:
    #         matchLabels:
    #           kubernetes.io/metadata.name: neo4j
    #   ports:
    #     - port: 7687

serviceAccount:
  create: true
  name: ''
  annotations: {}

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
