name: NeoDash

# Tests, image and Helm chart for this fork. Images go to GitHub Container Registry
# (ghcr.io/<owner>/neodash); version tags (v*) also get an offline install bundle.

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26.2-community
        env:
          NEO4J_AUTH: neo4j/devpassword
          NEO4J_PLUGINS: '["apoc"]'
        ports: ['7687:7687']
        options: >-
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1"
          --health-interval 5s --health-retries 30 --health-start-period 20s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install
        working-directory: server
        run: npm ci
      - name: Type-check
        working-directory: server
        run: npm run typecheck
      - name: Unit tests
        working-directory: server
        run: npm test
      - name: Seed example data
        working-directory: dev/seed
        env:
          NEO4J_AUTH: neo4j/devpassword
          MOVIES_CYPHER: ../../scripts/docker-neo4j-initializer/movies.cypher
        run: npm install --no-audit --no-fund && node seed.mjs
      - name: Integration tests
        working-directory: server
        run: npm run test:integration

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile --ignore-engines
      - run: yarn run build-minimal

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint and render
        run: |
          cat > ci-values.yaml <<'EOF'
          image: { repository: example/neodash }
          publicUrl: https://neodash.example.com
          neo4j: { auth: { existingSecret: neo4j-credentials } }
          oidc: { issuerUrl: https://keycloak.example.com/realms/acme, existingSecret: neodash-oidc }
          ingress: { host: neodash.example.com, tls: { secretName: neodash-tls } }
          networkPolicy: { enabled: true }
          EOF
          helm lint k8s-deploy/neodash -f ci-values.yaml
          helm template neodash k8s-deploy/neodash -f ci-values.yaml > /dev/null

  image:
    needs: [server, ui, chart]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/neodash
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  offline-bundle:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: sh scripts/offline-bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: neodash-offline
          path: neodash-offline-*/
