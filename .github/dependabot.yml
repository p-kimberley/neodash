version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'

  - package-ecosystem: 'npm'
    directory: '/server'
    schedule:
      interval: 'weekly'

  - package-ecosystem: 'npm'
    directory: '/docs'
    schedule:
      interval: 'weekly'

  # Base images in the Dockerfile (the distroless runtime is pinned by digest).
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
